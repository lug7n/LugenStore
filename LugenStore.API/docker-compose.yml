services:
  api:
    build: .
    image: lugenstore-api_api
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: LugenStoreDb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: LugenStoreDb
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: