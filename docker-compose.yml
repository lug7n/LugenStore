services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: lugenstore-api:latest
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=LugenStoreDb;Username=LugenStoreDb;Password=${DB_PASSWORD}"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: LugenStoreDb
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: LugenStoreDb
    ports: 
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
